name: Textbook content audit

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '工具-scripts/原始资料审计-source_audit.py'
      - '工具-scripts/内部链接审计-link_audit.py'
      - '.github/workflows/content-audit.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '工具-scripts/原始资料审计-source_audit.py'
      - '工具-scripts/内部链接审计-link_audit.py'
      - '.github/workflows/content-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库 / Checkout
        uses: actions/checkout@v4

      - name: 配置 Python / Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Source-First coverage report
        run: python 工具-scripts/原始资料审计-source_audit.py | tee source-audit.md

      - name: Strict internal-link audit
        run: python 工具-scripts/内部链接审计-link_audit.py

      - name: 上传来源覆盖报告 / Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: primary-source-coverage
          path: source-audit.md
          if-no-files-found: error
