name: Localize repository file tree

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/localize_file_tree.py'
      - '.github/workflows/localize-file-tree.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rename files and update links
        run: python scripts/localize_file_tree.py

      - name: Commit localized tree
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Repository file tree already localized.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: use Chinese-first bilingual file tree'
          git push
