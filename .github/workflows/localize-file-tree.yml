name: Localize repository file tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库 / Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python / Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 中文化文件树 / Localize file tree
        run: python '工具-scripts/文件树中文化-localize_file_tree.py'

      - name: 提交变更 / Commit localized tree
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Repository file tree already localized.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: use Chinese-first bilingual file tree'
          git push
