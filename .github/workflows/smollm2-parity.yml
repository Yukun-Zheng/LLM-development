name: SmolLM2 public checkpoint parity

on:
  push:
    branches: [main]
    paths:
      - '代码-code/从零构建Astra与Codex级系统/src/astra_codex/model.py'
      - '代码-code/从零构建Astra与Codex级系统/src/astra_codex/config.py'
      - '代码-code/从零构建Astra与Codex级系统/src/astra_codex/weights.py'
      - '代码-code/从零构建Astra与Codex级系统/src/astra_codex/public_checkpoint.py'
      - '代码-code/从零构建Astra与Codex级系统/examples/02_smollm2_parity.py'
      - '.github/workflows/smollm2-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - name: 检出仓库 / Checkout
        uses: actions/checkout@v4

      - name: 配置 Python / Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 代码-code/从零构建Astra与Codex级系统/pyproject.toml

      - name: 缓存公开 checkpoint / Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: smollm2-135m-${{ runner.os }}-v1

      - name: 安装 CPU PyTorch / Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 安装 parity 依赖 / Install parity dependencies
        working-directory: 代码-code/从零构建Astra与Codex级系统
        run: |
          python -m pip install safetensors huggingface_hub 'transformers>=4.46,<5'
          python -m pip install -e . --no-deps

      - name: 真实 checkpoint logits parity / Real checkpoint parity
        working-directory: 代码-code/从零构建Astra与Codex级系统
        run: python examples/02_smollm2_parity.py
