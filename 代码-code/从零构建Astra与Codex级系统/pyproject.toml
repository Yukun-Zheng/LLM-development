[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-codex-from-scratch"
version = "0.2.0"
description = "Educational from-scratch runtime for modern LLM, Astra-class and Codex-class systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
]

[project.optional-dependencies]
weights = ["safetensors>=0.4"]
parity = [
  "safetensors>=0.4",
  "huggingface_hub>=0.24",
  "transformers>=4.46,<5",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
